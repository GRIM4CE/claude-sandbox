<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Join screen */
    #join-screen {
      text-align: center;
    }

    #join-screen h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #e94560;
    }

    #join-screen input {
      padding: 12px 20px;
      font-size: 1rem;
      border: 2px solid #16213e;
      border-radius: 8px;
      background: #16213e;
      color: #eee;
      outline: none;
      width: 280px;
    }

    #join-screen input:focus {
      border-color: #e94560;
    }

    #join-screen button {
      display: block;
      margin: 1rem auto 0;
      padding: 12px 40px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    #join-screen button:hover {
      background: #c73652;
    }

    /* Chat screen */
    #chat-screen {
      display: none;
      width: 100%;
      height: 100vh;
    }

    .chat-layout {
      display: flex;
      height: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #16213e;
      padding: 1rem;
      border-right: 1px solid #0f3460;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #e94560;
      margin-bottom: 0.75rem;
      letter-spacing: 1px;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li {
      padding: 6px 0;
      font-size: 0.9rem;
      color: #aaa;
    }

    .sidebar li::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ecca3;
      margin-right: 8px;
    }

    /* Main chat area */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 1rem 1.5rem;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      font-weight: 600;
      font-size: 1.1rem;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .message {
      max-width: 70%;
      padding: 8px 14px;
      border-radius: 12px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.mine {
      align-self: flex-end;
      background: #e94560;
      color: #fff;
    }

    .message.theirs {
      align-self: flex-start;
      background: #16213e;
    }

    .message .meta {
      font-size: 0.75rem;
      color: #999;
      margin-bottom: 2px;
    }

    .message.mine .meta {
      color: #ffcdd2;
    }

    .message.system {
      align-self: center;
      background: none;
      color: #666;
      font-size: 0.8rem;
      font-style: italic;
      padding: 4px 0;
    }

    /* Input area */
    .chat-input {
      display: flex;
      padding: 1rem;
      background: #16213e;
      border-top: 1px solid #0f3460;
      gap: 0.5rem;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #1a1a2e;
      color: #eee;
      font-size: 1rem;
      outline: none;
    }

    .chat-input button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .chat-input button:hover {
      background: #c73652;
    }

    @media (max-width: 600px) {
      .sidebar { display: none; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>

  <div id="join-screen">
    <h1>Chat Room</h1>
    <input type="text" id="username-input" placeholder="Enter your name..." maxlength="30" autofocus>
    <button id="join-btn">Join Chat</button>
  </div>

  <div id="chat-screen">
    <div class="chat-layout">
      <aside class="sidebar">
        <h2>Online</h2>
        <ul id="user-list"></ul>
      </aside>
      <div class="chat-main">
        <div class="chat-header">Chat Room</div>
        <div id="messages"></div>
        <div class="chat-input">
          <input type="text" id="msg-input" placeholder="Type a message..." maxlength="1000">
          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const joinScreen = document.getElementById("join-screen");
    const chatScreen = document.getElementById("chat-screen");
    const usernameInput = document.getElementById("username-input");
    const joinBtn = document.getElementById("join-btn");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const messagesDiv = document.getElementById("messages");
    const userList = document.getElementById("user-list");

    let ws;
    let myUsername;

    function connect(username) {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: "join", username }));
        joinScreen.style.display = "none";
        chatScreen.style.display = "block";
        msgInput.focus();
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "chat") {
          addMessage(msg);
        } else if (msg.type === "system") {
          addSystemMessage(msg.text);
        } else if (msg.type === "users") {
          updateUserList(msg.users);
        }
      };

      ws.onclose = () => {
        addSystemMessage("Disconnected from server.");
      };
    }

    function addMessage(msg) {
      const div = document.createElement("div");
      const isMine = msg.username === myUsername;
      div.className = `message ${isMine ? "mine" : "theirs"}`;

      const time = new Date(msg.timestamp).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });

      div.innerHTML = `<div class="meta">${isMine ? "" : msg.username + " &middot; "}${time}</div>${escapeHtml(msg.text)}`;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement("div");
      div.className = "message system";
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateUserList(users) {
      userList.innerHTML = "";
      users.forEach((u) => {
        const li = document.createElement("li");
        li.textContent = u;
        userList.appendChild(li);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "chat", text }));
      msgInput.value = "";
    }

    joinBtn.addEventListener("click", () => {
      myUsername = usernameInput.value.trim();
      if (myUsername) connect(myUsername);
    });

    usernameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        myUsername = usernameInput.value.trim();
        if (myUsername) connect(myUsername);
      }
    });

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
