<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100dvh;
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @supports (height: 100dvh) {
      html, body { height: 100dvh; }
    }

    /* Auth screen */
    #auth-screen {
      text-align: center;
      width: 320px;
    }

    #auth-screen h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #e94560;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #16213e;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #16213e;
      color: #666;
    }

    .auth-tab.active {
      background: #e94560;
      color: #fff;
    }

    #auth-screen input {
      display: block;
      width: 100%;
      padding: 12px 20px;
      font-size: 1rem;
      border: 2px solid #16213e;
      border-radius: 8px;
      background: #16213e;
      color: #eee;
      outline: none;
      margin-bottom: 0.75rem;
    }

    #auth-screen input:focus {
      border-color: #e94560;
    }

    #auth-submit {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    #auth-submit:hover {
      background: #c73652;
    }

    #auth-error {
      color: #e94560;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      min-height: 1.2em;
    }

    #auth-success {
      color: #4ecca3;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      min-height: 1.2em;
    }

    /* Loading screen */
    #loading-screen {
      display: none;
      text-align: center;
    }

    #loading-screen h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #e94560;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto;
      border: 4px solid #16213e;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Chat screen */
    #chat-screen {
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chat-layout {
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .users-icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }

    .users-icon-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* Users overlay */
    .users-overlay {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100%;
      background: #1a1a2e;
      border-left: 1px solid #0f3460;
      z-index: 100;
      flex-direction: column;
    }

    .users-overlay.open {
      display: flex;
    }

    .users-overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .users-overlay-header button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .users-overlay-header button:hover {
      color: #fff;
    }

    #users-overlay-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 1.25rem;
    }

    .users-section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 1px;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    .users-section-label:first-child {
      margin-top: 0;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 0.9rem;
      color: #ccc;
    }

    .user-row .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .user-row .dot.online {
      background: #4ecca3;
    }

    .user-row .dot.offline {
      background: #666;
    }

    /* Main chat area */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .chat-header {
      padding: 1rem 1.5rem;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      font-weight: 600;
      font-size: 1.1rem;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header button {
      padding: 6px 14px;
      font-size: 0.8rem;
      border: 1px solid #e94560;
      border-radius: 6px;
      background: transparent;
      color: #e94560;
      cursor: pointer;
      font-weight: 600;
    }

    .chat-header button:hover {
      background: #e94560;
      color: #fff;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column-reverse;
      gap: 0.5rem;
    }

    #messages-inner {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: auto;
    }

    .message {
      max-width: 70%;
      padding: 8px 14px;
      border-radius: 12px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.mine {
      align-self: flex-end;
      background: #e94560;
      color: #fff;
    }

    .message.theirs {
      align-self: flex-start;
      background: #16213e;
    }

    .message .meta {
      font-size: 0.75rem;
      color: #999;
      margin-bottom: 2px;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
      background: #666;
    }

    .status-dot.online {
      background: #4ecca3;
    }

    .message.mine .meta {
      color: #ffcdd2;
    }

    .message.system {
      align-self: center;
      background: none;
      color: #666;
      font-size: 0.8rem;
      font-style: italic;
      padding: 4px 0;
    }

    .reactions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .reaction-badge {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      padding: 0;
      background: none;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      user-select: none;
    }

    .reaction-badge .count {
      font-size: 0.7rem;
      color: #aaa;
    }

    .react-btn {
      display: none;
      font-size: 0.85rem;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #999;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
    }

    .message-wrapper.selected .react-btn {
      display: inline-block;
    }

    .emoji-tray {
      display: none;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
      padding: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .emoji-tray.open {
      display: flex;
    }

    .emoji-tray button {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      line-height: 1;
    }

    .emoji-tray button:hover {
      background: rgba(255,255,255,0.15);
    }

    .message-wrapper {
      position: relative;
      max-width: 70%;
    }

    .message-wrapper.mine {
      align-self: flex-end;
    }

    .message-wrapper.theirs {
      align-self: flex-start;
    }

    .message-wrapper .message {
      max-width: 100%;
    }

    /* Input area */
    .chat-input {
      display: flex;
      padding: 1rem;
      background: #16213e;
      border-top: 1px solid #0f3460;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #1a1a2e;
      color: #eee;
      font-size: 1rem;
      outline: none;
    }

    .chat-input button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .chat-input button:hover {
      background: #c73652;
    }

    @media (max-width: 600px) {
      .message { max-width: 85%; }
      .users-overlay { width: 100%; }
    }
  </style>
</head>
<body>

  <div id="auth-screen">
    <h1>Chat Room</h1>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log In</button>
      <button class="auth-tab" data-tab="register">Sign Up</button>
    </div>
    <input type="text" id="auth-username" placeholder="Username" maxlength="30" autofocus>
    <input type="password" id="auth-password" placeholder="Password">
    <button id="auth-submit">Log In</button>
    <div id="auth-error"></div>
    <div id="auth-success"></div>
  </div>

  <div id="loading-screen">
    <h1>Chat Room</h1>
    <div class="spinner"></div>
  </div>

  <div id="users-overlay" class="users-overlay">
    <div class="users-overlay-header">
      <span>Users</span>
      <button id="users-close-btn">&times;</button>
    </div>
    <div id="users-overlay-list"></div>
  </div>

  <div id="chat-screen">
    <div class="chat-layout">
      <div class="chat-main">
        <div class="chat-header">
          <div class="chat-header-left">
            <button id="users-btn" class="users-icon-btn" title="Users">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </button>
            <span>Chat Room</span>
          </div>
          <button id="logout-btn">Log Out</button>
        </div>
        <div id="messages"><div id="messages-inner"></div></div>
        <div class="chat-input">
          <input type="text" id="msg-input" placeholder="Type a message..." maxlength="1000">
          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const authScreen = document.getElementById("auth-screen");
    const chatScreen = document.getElementById("chat-screen");
    const authUsername = document.getElementById("auth-username");
    const authPassword = document.getElementById("auth-password");
    const authSubmit = document.getElementById("auth-submit");
    const authError = document.getElementById("auth-error");
    const authSuccess = document.getElementById("auth-success");
    const logoutBtn = document.getElementById("logout-btn");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const messagesDiv = document.getElementById("messages");
    const messagesInner = document.getElementById("messages-inner");
    const usersBtn = document.getElementById("users-btn");
    const usersOverlay = document.getElementById("users-overlay");
    const usersCloseBtn = document.getElementById("users-close-btn");
    const usersOverlayList = document.getElementById("users-overlay-list");

    let ws;
    let myUsername;
    const onlineUsers = new Set();
    let allUsers = [];
    let reconnectDelay = 1000;
    let reconnectTimer = null;
    let intentionalClose = false;
    let authMode = "login";

    // --- Auth tabs ---
    document.querySelectorAll(".auth-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        authMode = tab.dataset.tab;
        document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        authSubmit.textContent = authMode === "login" ? "Log In" : "Sign Up";
        authError.textContent = "";
        authSuccess.textContent = "";
      });
    });

    // --- Auth submit ---
    async function handleAuth() {
      const username = authUsername.value.trim().toLowerCase();
      const password = authPassword.value;
      authError.textContent = "";
      authSuccess.textContent = "";

      if (!username || !password) {
        authError.textContent = "Please enter a username and password.";
        return;
      }

      const endpoint = authMode === "login" ? "/api/login" : "/api/register";
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          authError.textContent = data.error;
          return;
        }

        if (authMode === "register") {
          authSuccess.textContent = "Account created! Logging you in...";
          await new Promise((r) => setTimeout(r, 800));
        }

        myUsername = data.username;
        localStorage.setItem("chat_token", data.token);
        connect(myUsername);
      } catch {
        authError.textContent = "Could not reach the server.";
      }
    }

    authSubmit.addEventListener("click", handleAuth);
    authPassword.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleAuth();
    });
    authUsername.addEventListener("keydown", (e) => {
      if (e.key === "Enter") authPassword.focus();
    });

    // --- Auto-login from saved session ---
    const loadingScreen = document.getElementById("loading-screen");

    async function tryAutoLogin() {
      const token = localStorage.getItem("chat_token");
      if (!token) return;

      authScreen.style.display = "none";
      loadingScreen.style.display = "block";

      try {
        const res = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        if (!res.ok) {
          localStorage.removeItem("chat_token");
          loadingScreen.style.display = "none";
          authScreen.style.display = "block";
          return;
        }
        const data = await res.json();
        myUsername = data.username;
        connect(myUsername);
      } catch {
        loadingScreen.style.display = "none";
        authScreen.style.display = "block";
      }
    }

    tryAutoLogin();

    // --- Logout ---
    logoutBtn.addEventListener("click", async () => {
      const token = localStorage.getItem("chat_token");
      if (token) {
        fetch("/api/logout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        }).catch(() => {});
      }
      if (ws) ws.close();
      myUsername = null;
      localStorage.removeItem("chat_token");
      messagesInner.innerHTML = "";
      chatScreen.style.display = "none";
      authScreen.style.display = "block";
      authPassword.value = "";
      authError.textContent = "";
      authSuccess.textContent = "";
    });

    // --- WebSocket ---
    function connect(username) {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        intentionalClose = true;
        ws.close();
      }

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        reconnectDelay = 1000;
        const token = localStorage.getItem("chat_token");
        ws.send(JSON.stringify({ type: "join", token }));
        authScreen.style.display = "none";
        loadingScreen.style.display = "none";
        chatScreen.style.display = "block";
        msgInput.focus();
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "history") {
          messagesInner.innerHTML = "";
          msg.messages.forEach((m) => addMessage(m));
        } else if (msg.type === "chat") {
          addMessage(msg);
        } else if (msg.type === "reaction") {
          updateReactions(msg.msgId, msg.reactions);
        } else if (msg.type === "system") {
          addSystemMessage(msg.text);
        } else if (msg.type === "users") {
          updateUserList(msg.online, msg.all);
        }
      };

      ws.onclose = () => {
        if (intentionalClose) {
          intentionalClose = false;
          return;
        }
        if (myUsername) {
          addSystemMessage(`Disconnected. Reconnecting in ${reconnectDelay / 1000}s...`);
          reconnectTimer = setTimeout(() => {
            reconnectDelay = Math.min(reconnectDelay * 2, 30000);
            connect(myUsername);
          }, reconnectDelay);
        }
      };
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && myUsername && (!ws || ws.readyState !== WebSocket.OPEN)) {
        reconnectDelay = 1000;
        connect(myUsername);
      }
    });

    function addMessage(msg) {
      const isMine = msg.username === myUsername;
      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${isMine ? "mine" : "theirs"}`;
      wrapper.dataset.msgId = msg.msgId;

      const div = document.createElement("div");
      div.className = `message ${isMine ? "mine" : "theirs"}`;

      const time = new Date(msg.timestamp).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });

      const statusDot = !isMine ? `<span class="status-dot${onlineUsers.has(msg.username) ? " online" : ""}" data-username="${escapeHtml(msg.username)}"></span>` : "";
      div.innerHTML = `<div class="meta">${isMine ? "" : statusDot + escapeHtml(msg.username) + " &middot; "}${time}</div>${escapeHtml(msg.text)}`;

      // Tap message to show react button
      div.addEventListener("click", (e) => {
        e.stopPropagation();
        document.querySelectorAll(".message-wrapper.selected").forEach((w) => {
          if (w !== wrapper) w.classList.remove("selected");
        });
        wrapper.classList.toggle("selected");
      });

      const reactBtn = document.createElement("button");
      reactBtn.className = "react-btn";
      reactBtn.textContent = "+";

      const emojiTray = document.createElement("div");
      emojiTray.className = "emoji-tray";
      const emojis = ["👍","❤️","😂","😮","😢","😡","🎉","🔥","👀","🙏"];
      emojis.forEach((emoji) => {
        const btn = document.createElement("button");
        btn.textContent = emoji;
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          ws.send(JSON.stringify({ type: "react", msgId: msg.msgId, emoji }));
          emojiTray.classList.remove("open");
          wrapper.classList.remove("selected");
        });
        emojiTray.appendChild(btn);
      });

      reactBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        emojiTray.classList.toggle("open");
      });

      const reactionsBar = document.createElement("div");
      reactionsBar.className = "reactions-bar";

      wrapper.appendChild(div);
      wrapper.appendChild(reactBtn);
      wrapper.appendChild(emojiTray);
      wrapper.appendChild(reactionsBar);
      messagesInner.appendChild(wrapper);

      if (msg.reactions) {
        renderReactions(reactionsBar, msg.msgId, msg.reactions);
      }

      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function isEmoji(str) {
      const emojiRe = /^(\p{Emoji_Presentation}|\p{Emoji}\uFE0F)$/u;
      return emojiRe.test(str);
    }

    function renderReactions(bar, msgId, reactions) {
      bar.innerHTML = "";
      for (const [emoji, users] of Object.entries(reactions)) {
        const userList = Array.isArray(users) ? users : Array.from(users);
        if (userList.length === 0) continue;
        const badge = document.createElement("span");
        badge.className = "reaction-badge";
        if (userList.includes(myUsername)) badge.classList.add("mine");
        badge.innerHTML = `${emoji} <span class="count">${userList.length}</span>`;
        badge.title = userList.join(", ");
        badge.addEventListener("click", () => {
          ws.send(JSON.stringify({ type: "react", msgId, emoji }));
        });
        bar.appendChild(badge);
      }
    }

    function updateReactions(msgId, reactions) {
      const wrapper = messagesInner.querySelector(`[data-msg-id="${msgId}"]`);
      if (!wrapper) return;
      const bar = wrapper.querySelector(".reactions-bar");
      if (bar) renderReactions(bar, msgId, reactions);
    }

    function addSystemMessage(text) {
      const div = document.createElement("div");
      div.className = "message system";
      div.textContent = text;
      messagesInner.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateUserList(online, all) {
      onlineUsers.clear();
      online.forEach((u) => onlineUsers.add(u));
      allUsers = all || [];

      renderUsersOverlay();

      document.querySelectorAll(".status-dot").forEach((dot) => {
        const name = dot.dataset.username;
        if (onlineUsers.has(name)) {
          dot.classList.add("online");
        } else {
          dot.classList.remove("online");
        }
      });
    }

    function renderUsersOverlay() {
      usersOverlayList.innerHTML = "";
      const active = allUsers.filter((u) => onlineUsers.has(u));
      const inactive = allUsers.filter((u) => !onlineUsers.has(u));

      if (active.length > 0) {
        const label = document.createElement("div");
        label.className = "users-section-label";
        label.textContent = "Active";
        usersOverlayList.appendChild(label);
        active.forEach((u) => {
          const row = document.createElement("div");
          row.className = "user-row";
          row.innerHTML = `<span class="dot online"></span>${escapeHtml(u)}`;
          usersOverlayList.appendChild(row);
        });
      }

      if (inactive.length > 0) {
        const label = document.createElement("div");
        label.className = "users-section-label";
        label.textContent = "Inactive";
        usersOverlayList.appendChild(label);
        inactive.forEach((u) => {
          const row = document.createElement("div");
          row.className = "user-row";
          row.innerHTML = `<span class="dot offline"></span>${escapeHtml(u)}`;
          usersOverlayList.appendChild(row);
        });
      }
    }

    usersBtn.addEventListener("click", () => {
      usersOverlay.classList.toggle("open");
    });

    usersCloseBtn.addEventListener("click", () => {
      usersOverlay.classList.remove("open");
    });

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "chat", text }));
      msgInput.value = "";
    }

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    document.addEventListener("click", () => {
      document.querySelectorAll(".message-wrapper.selected").forEach((w) => w.classList.remove("selected"));
      document.querySelectorAll(".emoji-tray.open").forEach((t) => t.classList.remove("open"));
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        document.documentElement.style.height = window.visualViewport.height + "px";
      });
    }
  </script>
</body>
</html>
