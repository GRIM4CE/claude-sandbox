<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100dvh;
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @supports (height: 100dvh) {
      html, body { height: 100dvh; }
    }

    /* Auth screen */
    #auth-screen {
      text-align: center;
      width: 320px;
    }

    #auth-screen h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #e94560;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #16213e;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #16213e;
      color: #666;
    }

    .auth-tab.active {
      background: #e94560;
      color: #fff;
    }

    #auth-screen input {
      display: block;
      width: 100%;
      padding: 12px 20px;
      font-size: 1rem;
      border: 2px solid #16213e;
      border-radius: 8px;
      background: #16213e;
      color: #eee;
      outline: none;
      margin-bottom: 0.75rem;
    }

    #auth-screen input:focus {
      border-color: #e94560;
    }

    #auth-submit {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    #auth-submit:hover {
      background: #c73652;
    }

    #auth-error {
      color: #e94560;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      min-height: 1.2em;
    }

    #auth-success {
      color: #4ecca3;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      min-height: 1.2em;
    }

    /* Loading screen */
    #loading-screen {
      display: none;
      text-align: center;
    }

    #loading-screen h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #e94560;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto;
      border: 4px solid #16213e;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Chat screen */
    #chat-screen {
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .chat-layout {
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #16213e;
      padding: 1rem;
      border-right: 1px solid #0f3460;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #e94560;
      margin-bottom: 0.75rem;
      letter-spacing: 1px;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li {
      padding: 6px 0;
      font-size: 0.9rem;
      color: #aaa;
    }

    .sidebar li::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ecca3;
      margin-right: 8px;
    }

    /* Main chat area */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .chat-header {
      padding: 1rem 1.5rem;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      font-weight: 600;
      font-size: 1.1rem;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header button {
      padding: 6px 14px;
      font-size: 0.8rem;
      border: 1px solid #e94560;
      border-radius: 6px;
      background: transparent;
      color: #e94560;
      cursor: pointer;
      font-weight: 600;
    }

    .chat-header button:hover {
      background: #e94560;
      color: #fff;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column-reverse;
      gap: 0.5rem;
    }

    #messages-inner {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: auto;
    }

    .message {
      max-width: 70%;
      padding: 8px 14px;
      border-radius: 12px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.mine {
      align-self: flex-end;
      background: #e94560;
      color: #fff;
    }

    .message.theirs {
      align-self: flex-start;
      background: #16213e;
    }

    .message .meta {
      font-size: 0.75rem;
      color: #999;
      margin-bottom: 2px;
    }

    .message.mine .meta {
      color: #ffcdd2;
    }

    .message.system {
      align-self: center;
      background: none;
      color: #666;
      font-size: 0.8rem;
      font-style: italic;
      padding: 4px 0;
    }

    /* Input area */
    .chat-input {
      display: flex;
      padding: 1rem;
      background: #16213e;
      border-top: 1px solid #0f3460;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #1a1a2e;
      color: #eee;
      font-size: 1rem;
      outline: none;
    }

    .chat-input button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .chat-input button:hover {
      background: #c73652;
    }

    @media (max-width: 600px) {
      .sidebar { display: none; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>

  <div id="auth-screen">
    <h1>Chat Room</h1>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log In</button>
      <button class="auth-tab" data-tab="register">Sign Up</button>
    </div>
    <input type="text" id="auth-username" placeholder="Username" maxlength="30" autofocus>
    <input type="password" id="auth-password" placeholder="Password">
    <button id="auth-submit">Log In</button>
    <div id="auth-error"></div>
    <div id="auth-success"></div>
  </div>

  <div id="loading-screen">
    <h1>Chat Room</h1>
    <div class="spinner"></div>
  </div>

  <div id="chat-screen">
    <div class="chat-layout">
      <aside class="sidebar">
        <h2>Online</h2>
        <ul id="user-list"></ul>
      </aside>
      <div class="chat-main">
        <div class="chat-header">
          <span>Chat Room</span>
          <button id="logout-btn">Log Out</button>
        </div>
        <div id="messages"><div id="messages-inner"></div></div>
        <div class="chat-input">
          <input type="text" id="msg-input" placeholder="Type a message..." maxlength="1000">
          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const authScreen = document.getElementById("auth-screen");
    const chatScreen = document.getElementById("chat-screen");
    const authUsername = document.getElementById("auth-username");
    const authPassword = document.getElementById("auth-password");
    const authSubmit = document.getElementById("auth-submit");
    const authError = document.getElementById("auth-error");
    const authSuccess = document.getElementById("auth-success");
    const logoutBtn = document.getElementById("logout-btn");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const messagesDiv = document.getElementById("messages");
    const messagesInner = document.getElementById("messages-inner");
    const userList = document.getElementById("user-list");

    let ws;
    let myUsername;
    let reconnectDelay = 1000;
    let reconnectTimer = null;
    let intentionalClose = false;
    let authMode = "login";

    // --- Auth tabs ---
    document.querySelectorAll(".auth-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        authMode = tab.dataset.tab;
        document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        authSubmit.textContent = authMode === "login" ? "Log In" : "Sign Up";
        authError.textContent = "";
        authSuccess.textContent = "";
      });
    });

    // --- Auth submit ---
    async function handleAuth() {
      const username = authUsername.value.trim().toLowerCase();
      const password = authPassword.value;
      authError.textContent = "";
      authSuccess.textContent = "";

      if (!username || !password) {
        authError.textContent = "Please enter a username and password.";
        return;
      }

      const endpoint = authMode === "login" ? "/api/login" : "/api/register";
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          authError.textContent = data.error;
          return;
        }

        if (authMode === "register") {
          authSuccess.textContent = "Account created! Logging you in...";
          await new Promise((r) => setTimeout(r, 800));
        }

        myUsername = data.username;
        localStorage.setItem("chat_token", data.token);
        connect(myUsername);
      } catch {
        authError.textContent = "Could not reach the server.";
      }
    }

    authSubmit.addEventListener("click", handleAuth);
    authPassword.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleAuth();
    });
    authUsername.addEventListener("keydown", (e) => {
      if (e.key === "Enter") authPassword.focus();
    });

    // --- Auto-login from saved session ---
    const loadingScreen = document.getElementById("loading-screen");

    async function tryAutoLogin() {
      const token = localStorage.getItem("chat_token");
      if (!token) return;

      authScreen.style.display = "none";
      loadingScreen.style.display = "block";

      try {
        const res = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        if (!res.ok) {
          localStorage.removeItem("chat_token");
          loadingScreen.style.display = "none";
          authScreen.style.display = "block";
          return;
        }
        const data = await res.json();
        myUsername = data.username;
        connect(myUsername);
      } catch {
        loadingScreen.style.display = "none";
        authScreen.style.display = "block";
      }
    }

    tryAutoLogin();

    // --- Logout ---
    logoutBtn.addEventListener("click", () => {
      if (ws) ws.close();
      myUsername = null;
      localStorage.removeItem("chat_token");
      messagesInner.innerHTML = "";
      chatScreen.style.display = "none";
      authScreen.style.display = "block";
      authPassword.value = "";
      authError.textContent = "";
      authSuccess.textContent = "";
    });

    // --- WebSocket ---
    function connect(username) {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        intentionalClose = true;
        ws.close();
      }

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        reconnectDelay = 1000;
        ws.send(JSON.stringify({ type: "join", username }));
        authScreen.style.display = "none";
        loadingScreen.style.display = "none";
        chatScreen.style.display = "block";
        msgInput.focus();
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "history") {
          messagesInner.innerHTML = "";
          msg.messages.forEach((m) => addMessage(m));
        } else if (msg.type === "chat") {
          addMessage(msg);
        } else if (msg.type === "system") {
          addSystemMessage(msg.text);
        } else if (msg.type === "users") {
          updateUserList(msg.users);
        }
      };

      ws.onclose = () => {
        if (intentionalClose) {
          intentionalClose = false;
          return;
        }
        if (myUsername) {
          addSystemMessage(`Disconnected. Reconnecting in ${reconnectDelay / 1000}s...`);
          reconnectTimer = setTimeout(() => {
            reconnectDelay = Math.min(reconnectDelay * 2, 30000);
            connect(myUsername);
          }, reconnectDelay);
        }
      };
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && myUsername && (!ws || ws.readyState !== WebSocket.OPEN)) {
        reconnectDelay = 1000;
        connect(myUsername);
      }
    });

    function addMessage(msg) {
      const div = document.createElement("div");
      const isMine = msg.username === myUsername;
      div.className = `message ${isMine ? "mine" : "theirs"}`;

      const time = new Date(msg.timestamp).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });

      div.innerHTML = `<div class="meta">${isMine ? "" : msg.username + " &middot; "}${time}</div>${escapeHtml(msg.text)}`;
      messagesInner.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement("div");
      div.className = "message system";
      div.textContent = text;
      messagesInner.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateUserList(users) {
      userList.innerHTML = "";
      users.forEach((u) => {
        const li = document.createElement("li");
        li.textContent = u;
        userList.appendChild(li);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "chat", text }));
      msgInput.value = "";
    }

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        document.documentElement.style.height = window.visualViewport.height + "px";
      });
    }
  </script>
</body>
</html>
